<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: phone-style app column with a bottom tab bar (Patients / Hospital Analytics / Add Patient) */
:root{
  --bg:#F4F4F6; --card:#FFFFFF; --ink:#18181B; --ink2:#52525B; --muted:#71717A; --faint:#A1A1AA;
  --line:#E4E4E7; --soft:#F9F9FB; --blue:#2E5BFF; --blue-soft:#E6ECFF; --blue-ink:#1C3DC9;
  --ok:#047857; --ok-bg:#ECFDF5; --ok-line:#A7F3D0; --ok-icon:#10B981;
  --bad:#B91C1C; --bad-bg:#FEF2F2; --bad-line:#FECACA; --bad-icon:#EF4444;
  --amber:#D97706; --amber-bar:#F59E0B; --under:#3B82F6;
  --f-head:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"DM Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.shell{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.view{flex:1;padding-bottom:84px}
.ico{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}

/* Auth */
.auth{max-width:520px;margin:0 auto;padding:34px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.authlogo{width:56px;height:56px;border-radius:14px;background:var(--blue);display:grid;place-items:center;color:#fff}
.authlogo .ico{width:28px;height:28px}
.auth h1{font:800 28px/1 var(--f-head);margin:0}
.auth .tag{color:var(--muted);font-size:13px;margin-top:-10px}
.authcard{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.authcard h2{font:700 17px var(--f-head);margin:0}
.authcard .sub{color:var(--muted);font-size:12.5px;margin-top:-8px}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink);display:block;margin-bottom:6px}
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;outline:none}
.inp:focus{border-color:var(--blue);background:#fff}
.pw{display:flex;align-items:center;gap:8px}
.pw .eye{color:var(--muted);padding:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--blue);color:#fff;border-radius:10px;padding:12px;font-weight:700;font-size:15px}
.btn:disabled{opacity:.7}
.swap{text-align:center;color:var(--muted);font-size:13px}
.swap a{color:var(--blue);font-weight:700;text-decoration:none;margin-left:4px}
.note{font-size:11.5px;color:var(--faint);text-align:center;max-width:420px}

/* Banners */
.banner{display:flex;gap:8px;align-items:center;border:1px solid;border-radius:10px;padding:10px 12px;font-weight:600;font-size:13px}
.banner.err{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.banner .ico{width:18px;height:18px}

/* Header */
.hdr{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hdr-top{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.hdr h1{font:800 22px/1.15 var(--f-head);margin:0}
.hdr .sub{font-size:12px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--blue)}
.iconbtn.red{color:var(--bad)}
.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--blue);color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:42px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

/* Cards */
.list{padding:16px;display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;display:block;width:100%;text-align:left}
.pcard:hover{border-color:#cfd3db}
.pc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pc-who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font:700 11px var(--f-head);flex:none;overflow:hidden}
.pname{font:700 15px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdemo{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:12px;border:1px solid;font-size:12px;font-weight:600;flex:none}
.pill .ico{width:14px;height:14px}
.pill.clear{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.pill.notclear{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:8px;padding:8px;margin-bottom:10px;gap:4px}
.metrics div{text-align:center;min-width:0}
.metrics small{display:block;font-size:10px;color:var(--muted)}
.metrics b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-foot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--bg);padding-top:8px;font-size:12px;color:var(--muted)}
.pc-foot .ico{width:13px;height:13px;color:var(--ink2)}
.pc-foot b{color:var(--ink);font-weight:600}
.empty{text-align:center;padding:60px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.empty .ico{width:56px;height:56px;color:var(--faint)}
.empty h3{font:700 16px var(--f-head);color:var(--ink);margin:0}
.toast{margin:10px 16px 0;background:var(--ink);color:#fff;padding:10px;border-radius:10px;font-weight:600;font-size:13px}

/* Detail */
.dhdr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.dhdr h1{font:700 17px var(--f-head);margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhdr button{padding:4px;color:var(--ink)}
.dhdr .ico{width:24px;height:24px}
.dbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
.hero-top{display:flex;align-items:center;gap:14px}
.hero .avatar{width:60px;height:60px;font-size:16px}
.hero h2{font:800 22px var(--f-head);margin:0}
.hero .demo{color:var(--muted)}
.status{border:1px solid;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.status.clear{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.status.notclear{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.status-row{display:flex;gap:10px;align-items:flex-start}
.status-row .ico{width:22px;height:22px}
.status h4{margin:0;font:700 14px var(--f-head)}
.status p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.status button{align-self:flex-start;background:var(--card);border:1px solid currentColor;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;color:inherit}
.sect{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sect h3{font:700 15px var(--f-head);margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--soft);border-radius:10px;padding:10px;min-width:0}
.cell small{display:block;font-size:11px;color:var(--muted)}
.cell b{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.irow{display:flex;gap:12px;align-items:center;border-top:1px solid var(--bg);padding-top:12px}
.irow .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.irow .ib .ico{width:18px;height:18px}
.irow small{display:block;font-size:11.5px;color:var(--muted)}
.irow b{font-weight:600}
.del{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bad-line);background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px;font-weight:700}
.del .ico{width:16px;height:16px}

/* Analytics */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat .si{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.stat small{color:var(--muted);font-size:12px}
.stat b{font:800 24px var(--f-head);font-variant-numeric:tabular-nums}
.ratio-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ratio-head span{color:var(--ok);font-weight:700}
.ratio{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bad-icon)}
.ratio i{background:var(--ok-icon);display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sect .sub{font-size:12px;color:var(--muted);margin-top:-8px}
.bucket{display:flex;flex-direction:column;gap:6px}
.bucket div{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.bucket div b{font-weight:600}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.rank{display:flex;align-items:center;gap:12px}
.rank .n{width:32px;height:32px;border-radius:8px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font:700 13px var(--f-head);flex:none}
.rank small{display:block;color:var(--muted);font-size:12px}
.rank b{font-weight:600}

/* Add form */
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;gap:6px}
.toggle button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-weight:600;color:var(--ink2)}
.toggle button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.stsel{display:flex;gap:10px}
.stsel button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px;color:var(--muted);font-weight:600}
.stsel button .ico{width:18px;height:18px}
.stsel .y[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:700}
.stsel .n[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad);font-weight:700}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--blue)}
.tabs .ico{width:24px;height:24px}
@media (max-width:420px){ .grid3{grid-template-columns:1fr 1fr} .row2{grid-template-columns:1fr} }
</style>
</head>

function seedPatients(){
  return SHEET.map(([n, age, gender, height, weight, sleep, addiction, comorbidity, activity]) => mk({
    id: "p" + n, name: "Person " + n, age, gender, height, weight, sleepCycle: sleep, addiction, comorbidity, physicalActivity: activity,
    isClear: /^(no|none|nil)?$/i.test(comorbidity.trim())
  }));
}
function bmiFor(height, weight){
  const [f, i] = String(height).split(".");
  const m = ((parseInt(f) || 0) * 12 + (parseInt(i) || 0)) * 0.0254;
  const kg = parseFloat(weight);
  if (!m || !kg) return 0;
  return Math.round(kg / (m * m) * 10) / 10;
}
function mk(p){ return { ...p, bmi: bmiFor(p.height, p.weight), createdAt: p.createdAt || Date.now() }; }
let patients = load(K.patients, null);
if (!Array.isArray(patients)) { patients = seedPatients(); store(K.patients, patients); }
const savePatients = () => store(K.patients, patients);

/* ---------- Auth (local to this browser) ---------- */
async function hash(s){
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hpc:" + s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch { let h = 0; for (const c of "hpc:" + s) h = (h * 31 + c.charCodeAt(0)) | 0; return "f" + h; }
}
const session = () => load(K.session, null);
async function register(email, password){
  const users = load(K.users, {});
  const key = email.trim().toLowerCase();
  if (users[key]) throw new Error("An account with this email already exists");
  users[key] = { email: key, pw: await hash(password), createdAt: Date.now() };
  store(K.users, users); store(K.session, { email: key });
}
async function login(email, password){
  const users = load(K.users, {});
  const u = users[email.trim().toLowerCase()];
  if (!u || u.pw !== await hash(password)) throw new Error("Invalid email or password");
  store(K.session, { email: u.email });
}
function signOut(){ try { localStorage.removeItem(K.session); } catch {} go("#/login"); }

/* ---------- Router ---------- */
addEventListener("hashchange", route);
function route(){
  const h = location.hash || "#/";
  const authed = !!session();
  const [, page, arg] = h.split("/");
  if (!authed && page !== "login" && page !== "register") return go("#/login");
  if (authed && (page === "login" || page === "register" || !page)) return go("#/patients");
  const tabs = $("tabs");
  tabs.hidden = !["patients","analytics","add"].includes(page);
  tabs.querySelectorAll("a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === page ? "page" : "false"));
  window.scrollTo(0, 0);
  ({ login: viewLogin, register: viewRegister, patients: viewPatients, analytics: viewAnalytics, add: viewAdd, patient: () => viewDetail(arg) }[page] || viewPatients)();
}

/* ---------- CSV ---------- */
const COLS = ["Name","Age","Gender","Height","Weight","BMI","Sleep Cycle","Addiction","Comorbidity","Physical Activity","Status"];
const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
function exportCsv(){
  const rows = [COLS.join(",")].concat(patients.map(row));
  function row(p){ return [p.name,p.age,p.gender,p.height,p.weight,p.bmi,p.sleepCycle,p.addiction,p.comorbidity,p.physicalActivity,p.isClear ? "Clear" : "Not Clear"].map(q).join(","); }
  const blob = new Blob([rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `hpc_patients_${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showToast(`Exported ${patients.length} records`);
}
function parseCsv(text){
  const rows = []; let row = [], f = "", inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else inQ = false; } else f += c; }
    else if (c === '"') inQ = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
$("csvFile").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const rows = parseCsv(await file.text());
    if (rows.length < 2) throw new Error("CSV has no data rows");
    const h = rows[0].map(x => x.trim().toLowerCase().replace(/[^a-z]/g, ""));
    const col = (...names) => h.findIndex(x => names.includes(x));
    const ix = { name: col("name","patientname"), age: col("age"), gender: col("gender","sex"), height: col("height","heightft","heightftin"),
      weight: col("weight","weightkg"), sleep: col("sleepcycle","sleep"), add: col("addiction","addictionhabit","habits"),
      com: col("comorbidity","comorbidities"), act: col("physicalactivity","activity"), st: col("status","clearance","isclear") };
    if (ix.name < 0) throw new Error("CSV needs a Name column");
    let imported = 0, skipped = 0;
    for (const r of rows.slice(1)){
      const g = k => ix[k] >= 0 ? String(r[ix[k]] ?? "").trim() : "";
      const age = parseInt(g("age")), weight = parseFloat(g("weight"));
      if (!g("name") || isNaN(age) || age <= 0 || isNaN(weight) || weight <= 0){ skipped++; continue; }
      const st = g("st").toLowerCase();
      const com = g("com") || "No";
      patients.push(mk({ id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), name: g("name"), age,
        gender: (g("gender") || "M").toUpperCase().slice(0, 1), height: g("height") || "5.6", weight,
        sleepCycle: g("sleep") || "6-7 HRS", addiction: g("add") || "No", comorbidity: com, physicalActivity: g("act") || "moderate",
        isClear: st ? /^(clear|yes|true|1)$/.test(st) : !hasComorb({ comorbidity: com }) }));
      imported++;
    }
    savePatients(); showToast(`Imported ${imported} · Skipped ${skipped}`); drawList();
  } catch(x){ showToast(x.message || "Import failed"); }
};

/* ---------- Analytics ---------- */
function analytics(){
  const total = patients.length, clear = patients.filter(p => p.isClear).length;
  const bmis = patients.map(p => +p.bmi).filter(b => b > 0);
  const avg = bmis.length ? Math.round(bmis.reduce((a, b) => a + b, 0) / bmis.length * 10) / 10 : 0;
  const buckets = { normal: 0, overweight: 0, obese: 0, underweight: 0 };
  bmis.forEach(b => buckets[b < 18.5 ? "underweight" : b < 25 ? "normal" : b < 30 ? "overweight" : "obese"]++);
  const tally = {};
  patients.forEach(p => {
    if (!hasComorb(p)) return;
    String(p.comorbidity).split(/,|\band\b|\//i).map(s => s.trim()).filter(Boolean).forEach(s => {
      const key = s.toLowerCase();
      tally[key] = tally[key] || { label: s.replace(/^\w/, c => c.toUpperCase()), count: 0 };
      tally[key].count++;
    });
  });
  const top = Object.values(tally).sort((a, b) => b.count - a.count).slice(0, 5);
  return { total, clear, notClear: total - clear, clearanceRate: total ? Math.round(clear / total * 100) : 0, avgBmi: avg, bmiBuckets: buckets, topComorbidities: top };
}

  $("view").innerHTML = `

          .map(([l, c, col]) => `<div class="bucket"><div><span>${l}</span><b>${c} (${pct(c)}%)</b></div><div class="bar"><i style="width:${pct(c)}%;background:${col}"></i></div></div>`).join("")}

      </div>
      <div class="row2">
        <div><label class="lbl" for="aht">Height (ft.in)</label><input class="inp" id="aht" value="5.6" placeholder="e.g. 5.6"></div>
        <div><label class="lbl" for="awt">Weight (kg) *</label><input class="inp" id="awt" inputmode="decimal" placeholder="e.g. 70"></div>
      </div>
      <div><label class="lbl" for="aslp">Sleep Cycle</label><input class="inp" id="aslp" value="6-7 HRS" placeholder="e.g. 6-7 HRS"></div>
      <div><label class="lbl" for="aadd">Addiction / Habits</label><input class="inp" id="aadd" value="No" placeholder="e.g. No, Bettlenut, Smoking, Phone"></div>
      <div><label class="lbl" for="acom">Comorbidity</label><input class="inp" id="acom" value="No" placeholder="e.g. No, Diabetes, BP, Heart disease"></div>
      <div><label class="lbl" for="aact">Physical Activity</label><input class="inp" id="aact" value="moderate" placeholder="e.g. moderate, mild, no, high"></div>
      <div><span class="lbl">Hospital Clearance Status</span><div class="stsel">
        <button type="button" class="y" id="sy" aria-pressed="true">${ic("check")} Clear Record</button>
        <button type="button" class="n" id="sn" aria-pressed="false">${ic("alert")} Not Clear</button></div></div>
      <button class="btn" id="asave">${ic("personadd")} Save Patient Record</button>
    </form>`;
  $("agen").querySelectorAll("button").forEach(b => b.onclick = () => { f.gender = b.dataset.g; $("agen").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  const setSt = v => { f.isClear = v; $("sy").setAttribute("aria-pressed", v); $("sn").setAttribute("aria-pressed", !v); };
  $("sy").onclick = () => setSt(true); $("sn").onclick = () => setSt(false);
  $("af").onsubmit = e => {
    e.preventDefault();
    const err = $("aerr"), ok = $("aok"); err.hidden = true; ok.hidden = true;
    const fail = m => { err.innerHTML = ic("alert") + " " + esc(m); err.hidden = false; window.scrollTo(0, 0); };
    const name = $("aname").value.trim(), age = parseInt($("aage").value, 10), weight = parseFloat($("awt").value);
    if (!name) return fail(`Please enter patient name (e.g. Person ${patients.length + 1})`);
    if (isNaN(age) || age <= 0) return fail("Please enter a valid numeric age");
    if (isNaN(weight) || weight <= 0) return fail("Please enter a valid weight in kg");
    patients.push(mk({ id: "p" + Date.now().toString(36), name, age, gender: f.gender, height: $("aht").value.trim() || "5.6", weight,
      sleepCycle: $("aslp").value.trim() || "6-7 HRS", addiction: $("aadd").value.trim() || "No", comorbidity: $("acom").value.trim() || "No",
      physicalActivity: $("aact").value.trim() || "moderate", isClear: f.isClear }));
    savePatients();
    ok.hidden = false; $("asave").disabled = true; window.scrollTo(0, 0);
    setTimeout(() => go("#/patients"), 900);
  };
}

route();
})();
</script>
</body>
</html>
